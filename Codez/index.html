<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff8fb1">

<title>Chapter One — Us ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>

/* =========================================================
   COLOR SYSTEM
========================================================= */

:root{
  --pink:#ff7fa5;
  --pink-light:#ffd0df;
  --pink-dark:#d94f7c;

  --purple:#9d83ff;
  --purple-light:#ddd4ff;

  --yellow:#ffd86b;
  --orange:#ffad72;

  --mint:#78d6ad;
  --blue:#82cfff;

  --green:#5eaa78;
  --green-dark:#183d2b;

  --cream:#fffaf5;
  --white:#ffffff;

  --ink:#382638;
  --soft:#6f6070;

  --shadow:0 25px 70px rgba(77,38,73,.15);
}

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  overflow-x:hidden;
  color:var(--ink);
  font-family:"DM Sans",sans-serif;
  background:#fff4fa;
}

/* =========================================================
   BACKGROUND
========================================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-5;

  background:
    radial-gradient(circle at 10% 15%,rgba(255,170,202,.35),transparent 24%),
    radial-gradient(circle at 90% 10%,rgba(173,145,255,.30),transparent 24%),
    radial-gradient(circle at 80% 75%,rgba(123,220,183,.25),transparent 25%),
    radial-gradient(circle at 15% 85%,rgba(255,218,115,.28),transparent 24%),
    linear-gradient(135deg,#fff5fb,#fffaf1,#f5fff9);
}

/* =========================================================
   GRAIN
========================================================= */

.grain{
  position:fixed;
  inset:0;
  z-index:1000;
  pointer-events:none;
  opacity:.045;

  background-image:
    radial-gradient(#ffffff 1px,transparent 1px);

  background-size:5px 5px;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress{
  position:fixed;
  z-index:1100;
  top:0;
  left:0;

  width:0;
  height:5px;

  background:
    linear-gradient(
      90deg,
      var(--pink),
      var(--orange),
      var(--yellow),
      var(--mint),
      var(--purple)
    );

  box-shadow:0 0 18px rgba(255,127,165,.8);
}

/* =========================================================
   NAVIGATION
========================================================= */

.nav{
  position:fixed;
  z-index:900;

  top:0;
  left:0;
  right:0;

  padding:20px clamp(20px,5vw,70px);

  display:flex;
  justify-content:space-between;
  align-items:center;

  color:white;

  transition:.35s ease;
}

.nav.scrolled{
  color:var(--ink);

  background:rgba(255,255,255,.78);

  backdrop-filter:blur(20px);

  box-shadow:
    0 5px 30px rgba(76,39,65,.12);
}

.brand{
  font-family:"Libre Baskerville",serif;
  font-weight:700;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav a{
  color:inherit;
  text-decoration:none;

  font:500 .68rem "DM Mono",monospace;

  letter-spacing:.1em;
  text-transform:uppercase;

  transition:.2s;
}

.nav a:hover{
  color:var(--pink);
}

/* =========================================================
   TYPOGRAPHY
========================================================= */

.brand,
h1,
h2,
h3{
  font-family:"Libre Baskerville",serif;
}

h1,
h2,
h3{
  margin:0;
  line-height:1.08;
  font-weight:400;
  letter-spacing:-.045em;
}

h1{
  font-size:clamp(4rem,9vw,9rem);
}

h2{
  font-size:clamp(2.6rem,5.5vw,5.2rem);
  max-width:850px;
}

h3{
  font-size:1.7rem;
}

p{
  font-size:1.04rem;
  line-height:1.8;
}

.lede{
  max-width:650px;
  margin:25px 0;
  color:#655867;
}

.eyebrow{
  margin:0 0 18px;

  color:var(--pink-dark);

  font:500 .72rem "DM Mono",monospace;

  letter-spacing:.15em;

  text-transform:uppercase;
}

/* =========================================================
   CHAPTER
========================================================= */

.chapter{
  position:relative;
  isolation:isolate;

  min-height:90vh;

  padding:130px 0;

  display:grid;
  align-items:center;

  overflow:hidden;
}

/* =========================================================
   WRAPPER
========================================================= */

.wrap{
  position:relative;
  z-index:10;

  width:min(1120px,88%);

  margin:auto;
}

/* =========================================================
   COLORFUL CHAPTER BACKGROUNDS
========================================================= */

.paper{
  background:
    radial-gradient(circle at 15% 20%,rgba(255,165,197,.32),transparent 25%),
    radial-gradient(circle at 85% 70%,rgba(172,143,255,.25),transparent 28%),
    linear-gradient(135deg,#fff9fc,#fff8ef);
}

.blush{
  background:
    radial-gradient(circle at 20% 20%,rgba(255,125,166,.38),transparent 28%),
    radial-gradient(circle at 85% 30%,rgba(255,210,111,.4),transparent 27%),
    radial-gradient(circle at 50% 100%,rgba(157,131,255,.25),transparent 35%),
    linear-gradient(135deg,#fff0f6,#fff8df);
}

.sage{
  background:
    radial-gradient(circle at 10% 20%,rgba(119,215,174,.42),transparent 27%),
    radial-gradient(circle at 85% 75%,rgba(126,204,255,.32),transparent 28%),
    radial-gradient(circle at 70% 10%,rgba(198,159,255,.3),transparent 25%),
    linear-gradient(135deg,#effff7,#f7f2ff);
}

/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:100vh;

  color:white;

  background:
    radial-gradient(circle at 20% 15%,#ff8faf 0,transparent 23%),
    radial-gradient(circle at 82% 20%,#a98cff 0,transparent 23%),
    radial-gradient(circle at 50% 90%,#64c99b 0,transparent 30%),
    radial-gradient(circle at 90% 85%,#ffca68 0,transparent 25%),
    linear-gradient(135deg,#173c31,#355d47 50%,#744e69);
}

.hero::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at 30% 60%,rgba(255,255,255,.15),transparent 15%),
    radial-gradient(circle at 70% 45%,rgba(255,255,255,.12),transparent 15%);

  pointer-events:none;
}

.hero .eyebrow{
  color:#ffe276;
}

.hero .lede{
  color:#fff4f8;
}

.hero h1 em{
  color:#ffe276;
}

/* =========================================================
   FINAL
========================================================= */

.final{
  min-height:100vh;

  color:white;

  background:
    radial-gradient(circle at 20% 15%,#ff8fab 0,transparent 23%),
    radial-gradient(circle at 80% 25%,#a48aff 0,transparent 25%),
    radial-gradient(circle at 50% 90%,#6ed5a4 0,transparent 28%),
    radial-gradient(circle at 95% 85%,#ffd56d 0,transparent 25%),
    linear-gradient(140deg,#1b352a,#574463,#805b68);
}

.final .eyebrow{
  color:#ffe276;
}

.final .lede{
  color:#ffeef5;
}

/* =========================================================
   HERO GRID
========================================================= */

.hero-grid,
.split{
  display:grid;

  grid-template-columns:1fr .75fr;

  gap:10vw;

  align-items:center;
}

/* =========================================================
   STAMP
========================================================= */

.stamp{
  width:min(360px,70vw);

  aspect-ratio:1;

  display:grid;
  place-items:center;

  border:2px solid rgba(255,222,119,.8);

  border-radius:50%;

  background:
    radial-gradient(circle,
      rgba(255,255,255,.18),
      rgba(255,255,255,.03) 60%,
      transparent 61%
    );

  box-shadow:
    inset 0 0 0 18px rgba(255,222,119,.08),
    inset 0 0 60px rgba(255,255,255,.08),
    0 30px 90px rgba(0,0,0,.25);

  animation:
    stampFloat 5s ease-in-out infinite;
}

@keyframes stampFloat{

  50%{
    transform:
      translateY(-15px)
      rotate(3deg);
  }

}

.stamp span{
  font:
    italic clamp(3rem,7vw,6rem)
    "Libre Baskerville",serif;

  color:#ffe276;

  text-shadow:
    0 0 30px rgba(255,226,118,.4);
}

/* =========================================================
   BUTTONS
========================================================= */

.button{
  display:inline-flex;

  align-items:center;
  gap:10px;

  margin-top:18px;

  padding:15px 22px;

  border:1px solid rgba(255,255,255,.5);

  border-radius:50px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.25),
      rgba(255,255,255,.08)
    );

  color:inherit;

  text-decoration:none;

  cursor:pointer;

  font:
    500 .72rem "DM Mono",monospace;

  letter-spacing:.08em;

  text-transform:uppercase;

  backdrop-filter:blur(10px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.08);

  transition:.3s;
}

.button:after{
  content:"♡";
  font-size:1rem;
}

.button:hover{
  transform:
    translateY(-5px)
    scale(1.03);

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  color:white;

  box-shadow:
    0 15px 35px rgba(221,92,143,.3);
}

/* =========================================================
   CARD
========================================================= */

.card{
  padding:30px;

  border:
    1px solid rgba(255,255,255,.65);

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.82),
      rgba(255,245,250,.65)
    );

  backdrop-filter:blur(16px);

  box-shadow:var(--shadow);

  transition:.35s;

  position:relative;

  overflow:hidden;
}

.card::before{
  content:"";

  position:absolute;

  width:140px;
  height:140px;

  right:-60px;
  top:-60px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,127,165,.28),
      transparent 70%
    );
}

.card:hover{
  box-shadow:
    0 30px 80px rgba(86,43,79,.22);
}

/* =========================================================
   CARD GRID
========================================================= */

.card-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:20px;

  margin-top:35px;
}

.card-grid .card{
  min-height:230px;
}

/* =========================================================
   CARD MARK
========================================================= */

.card-mark,
.number{
  display:block;

  margin-bottom:26px;

  color:var(--pink);

  font:
    italic 3rem
    "Libre Baskerville",serif;
}

/* =========================================================
   PHOTO
========================================================= */

.photo{
  height:230px;

  display:grid;
  place-items:center;

  position:relative;

  overflow:hidden;

  border-radius:18px;

  color:white;

  font:
    italic 2rem
    "Libre Baskerville",serif;

  background:
    linear-gradient(
      135deg,
      #ff8eae,
      #a18aff,
      #70d5aa,
      #ffd56c
    );

  background-size:300% 300%;

  animation:
    gradientMove 8s ease infinite;
}

@keyframes gradientMove{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}

.photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.image-placeholder{
  padding:15px;

  text-align:center;

  font:
    500 .7rem
    "DM Mono",monospace;

  letter-spacing:.1em;

  text-transform:uppercase;
}

/* =========================================================
   QUOTE
========================================================= */

.quote{
  max-width:850px;

  font:
    italic clamp(1.6rem,3vw,2.65rem)/1.55
    "Libre Baskerville",serif;
}

.quote:before{
  content:"“";

  display:block;

  color:var(--pink);

  font-size:5rem;

  line-height:.55;
}

/* =========================================================
   ARTWORK
========================================================= */

.artwork{
  position:relative;

  min-height:420px;

  overflow:hidden;

  border-radius:35px;

  border:3px solid rgba(255,255,255,.7);

  background:
    radial-gradient(circle at 20% 20%,#ff9fba 0 8%,transparent 9%),
    radial-gradient(circle at 70% 30%,#a993ff 0 10%,transparent 11%),
    radial-gradient(circle at 35% 75%,#73d5a9 0 13%,transparent 14%),
    radial-gradient(circle at 75% 75%,#ffd16c 0 10%,transparent 11%),
    linear-gradient(135deg,#ffe5ef,#e6dcff,#dcfff0);

  box-shadow:
    0 30px 70px rgba(87,48,91,.2);

  animation:
    artworkFloat 6s ease-in-out infinite;
}

@keyframes artworkFloat{

  50%{
    transform:translateY(-10px) rotate(1deg);
  }

}

.artwork::before{
  content:"";

  position:absolute;

  inset:12%;

  border:2px solid rgba(117,72,99,.5);

  border-radius:
    52% 40% 52% 40%;

  background:
    radial-gradient(
      ellipse at 28% 30%,
      #f28fa7 0 11%,
      transparent 12%
    ),
    radial-gradient(
      ellipse at 73% 66%,
      #5b9d78 0 18%,
      transparent 19%
    ),
    radial-gradient(
      ellipse at 48% 64%,
      #e8bd58 0 8%,
      transparent 9%
    ),
    radial-gradient(
      ellipse at 60% 35%,
      #9e87df 0 10%,
      transparent 11%
    );
}

.artwork img{
  position:absolute;
  inset:18px;
  width:calc(100% - 36px);
  height:calc(100% - 36px);
  object-fit:cover;
  border-radius:25px;
  z-index:2;
  display:block;
  box-shadow:0 15px 35px rgba(80,38,67,.2);
  transition:transform .5s ease, filter .5s ease;
}

.artwork:hover img{
  transform:scale(1.04);
  filter:saturate(1.08);
}

.artwork::after{
  content:"for Yangii ♡";

  position:absolute;

  right:8%;
  bottom:8%;

  font:
    italic 1.2rem
    "Libre Baskerville",serif;

  color:#734d63;
}

/* =========================================================
   SONGS
========================================================= */

.song{
  cursor:pointer;
}

.song .number{
  margin-bottom:45px;
}

.song-link{
  color:inherit;

  text-decoration:none;

  display:block;

  height:100%;
}

.song-link:hover{
  color:var(--pink-dark);
}

/* =========================================================
   METER
========================================================= */

.meter{
  height:8px;

  margin:28px 0;

  border-radius:20px;

  overflow:hidden;

  background:rgba(108,77,95,.12);
}

.meter i{
  display:block;

  width:0;

  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      var(--pink),
      var(--orange),
      var(--yellow),
      var(--mint),
      var(--purple)
    );

  transition:.3s;
}

/* =========================================================
   HEART GAME
========================================================= */

.heart-zone{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:15px;

  padding:35px;

  border-radius:30px;

  background:
    linear-gradient(
      135deg,
      rgba(255,150,185,.13),
      rgba(159,133,255,.13),
      rgba(118,213,170,.13)
    );

  border:
    1px solid rgba(255,255,255,.7);

  box-shadow:
    inset 0 0 30px rgba(255,255,255,.4);
}

.heart{
  border:0;

  background:transparent;

  color:var(--pink);

  font-size:2.5rem;

  cursor:pointer;

  transition:.25s;

  filter:
    drop-shadow(
      0 5px 8px rgba(255,95,140,.18)
    );
}

.heart:hover{
  transform:
    scale(1.35)
    rotate(8deg);
}

.heart:active{
  transform:scale(.8);
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  z-index:2000;

  left:50%;
  bottom:25px;

  transform:
    translate(-50%,140px);

  padding:15px 22px;

  border-radius:50px;

  background:
    linear-gradient(
      135deg,
      var(--pink-dark),
      var(--purple)
    );

  color:white;

  box-shadow:
    0 15px 40px rgba(95,42,89,.25);

  font:
    500 .75rem
    "DM Mono",monospace;

  transition:.4s;
}

.toast.show{
  transform:
    translate(-50%,0);
}

/* =========================================================
   FLOWER FIELD
========================================================= */

.flower-scape{
  position:absolute;

  inset:0;

  z-index:2;

  pointer-events:none;

  overflow:hidden;
}

.bloom-shape{
  position:absolute;

  width:var(--s);
  height:var(--s);

  transform:rotate(var(--r));

  filter:
    drop-shadow(
      0 12px 9px rgba(80,38,67,.12)
    );

  animation:
    flowerFloat var(--d)
    ease-in-out infinite;

  animation-delay:var(--delay);
}

.bloom-shape span{
  position:absolute;

  width:46%;
  height:46%;

  left:27%;
  top:27%;

  background:var(--c);

  border-radius:
    78% 22% 75% 25%;

  transform-origin:50% 115%;

  box-shadow:
    inset -5px -6px 9px rgba(0,0,0,.08);
}

.bloom-shape span:nth-child(2){
  transform:rotate(72deg);
}

.bloom-shape span:nth-child(3){
  transform:rotate(144deg);
}

.bloom-shape span:nth-child(4){
  transform:rotate(216deg);
}

.bloom-shape span:nth-child(5){
  transform:rotate(288deg);
}

.bloom-shape::after{
  content:"";

  position:absolute;

  width:26%;
  height:26%;

  left:37%;
  top:37%;

  border-radius:50%;

  background:#ffd86b;

  box-shadow:
    0 0 10px rgba(255,216,107,.8);
}

@keyframes flowerFloat{

  0%{
    transform:
      translateY(0)
      rotate(var(--r));
  }

  50%{
    transform:
      translateY(-25px)
      rotate(calc(var(--r) + 13deg))
      scale(1.08);
  }

  100%{
    transform:
      translateY(0)
      rotate(var(--r));
  }

}

/* =========================================================
   FLOATING BUTTERFLIES
========================================================= */

.butterfly{
  position:absolute;

  z-index:3;

  font-size:2rem;

  opacity:.65;

  animation:
    butterflyFly
    var(--duration)
    ease-in-out infinite;

  animation-delay:var(--delay);
}

@keyframes butterflyFly{

  0%{
    transform:
      translate(0,0)
      rotate(-10deg);
  }

  50%{
    transform:
      translate(40px,-50px)
      rotate(12deg);
  }

  100%{
    transform:
      translate(0,0)
      rotate(-10deg);
  }

}

/* =========================================================
   SPARKLES
========================================================= */

.sparkle{
  position:absolute;

  z-index:2;

  color:white;

  font-size:1.2rem;

  text-shadow:
    0 0 12px white;

  animation:
    sparkle 3s ease-in-out infinite;
}

@keyframes sparkle{

  0%,100%{
    opacity:.2;
    transform:scale(.7);
  }

  50%{
    opacity:1;
    transform:scale(1.4);
  }

}

/* =========================================================
   EDIT NOTE
========================================================= */

.edit-note{
  max-width:820px;

  margin:
    0 auto 36px;

  padding:
    15px 18px;

  border-left:
    4px solid var(--pink);

  border-radius:
    0 15px 15px 0;

  background:
    rgba(255,255,255,.65);

  backdrop-filter:blur(10px);

  color:#665d68;

  font-size:.9rem;
}

/* =========================================================
   LITTLE DECORATIVE ORBS
========================================================= */

.orb{
  position:absolute;

  border-radius:50%;

  filter:blur(1px);

  opacity:.45;

  animation:
    orbFloat
    var(--d)
    ease-in-out infinite;
}

@keyframes orbFloat{

  50%{
    transform:
      translateY(-35px)
      translateX(20px)
      scale(1.1);
  }

}

/* =========================================================
   HIDDEN
========================================================= */

.hidden{
  display:none;
}

/* =========================================================
   REVEAL ANIMATION
========================================================= */

.chapter .wrap{
  transition:
    opacity .9s,
    transform .9s;
}

.chapter:not(.seen) .wrap{
  opacity:0;

  transform:
    translateY(35px);
}

.chapter.seen .wrap{
  opacity:1;

  transform:none;
}

/* =========================================================
   CLICK PETALS
========================================================= */

.click-petal{
  position:fixed;

  z-index:1900;

  pointer-events:none;

  width:17px;
  height:27px;

  border-radius:
    100% 0 100% 0;

  transition:
    transform 1.1s
    cubic-bezier(.2,.8,.3,1),
    opacity 1.1s;
}

/* =========================================================
   LIGHT SWEEP
========================================================= */

.chapter::after{
  content:"";

  position:absolute;

  inset:0;

  z-index:4;

  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      transparent 35%,
      rgba(255,255,255,.22) 50%,
      transparent 65%
    );

  transform:
    translateX(-130%);

  animation:
    sheen 12s
    ease-in-out infinite;
}

@keyframes sheen{

  35%,100%{
    transform:
      translateX(130%);
  }

}

/* =========================================================
   CURSOR GLOW
========================================================= */

.cursor-glow{
  position:fixed;

  z-index:1;

  width:350px;
  height:350px;

  border-radius:50%;

  pointer-events:none;

  transform:
    translate(-50%,-50%);

  background:
    radial-gradient(
      circle,
      rgba(255,175,205,.18),
      rgba(166,140,255,.08) 35%,
      transparent 70%
    );
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  .nav{
    padding:18px 20px;
  }

  .nav-links{
    display:none;
  }

  .chapter{
    min-height:78vh;

    padding:
      105px 0;
  }

  .hero-grid,
  .split{
    grid-template-columns:1fr;

    gap:50px;
  }

#flowerLoader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,143,177,.42),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(157,131,255,.38),transparent 28%),
    radial-gradient(circle at 80% 85%,rgba(120,214,173,.35),transparent 30%),
    radial-gradient(circle at 20% 85%,rgba(255,216,107,.38),transparent 30%),
    linear-gradient(135deg,#fff5fb,#fffaf1,#f5fff9);
  transition:opacity 1s ease,visibility 1s ease;
}

#flowerLoader.loaded{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-flower{
  position:relative;
  width:160px;
  height:160px;
  animation:loaderFlowerFloat 3s ease-in-out infinite;
}

.loader-petal{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:88px;
  margin-left:-31px;
  margin-top:-88px;
  transform-origin:50% 100%;
  border-radius:70% 70% 50% 50%;
  background:linear-gradient(145deg,#ff9fbd,#ff6f9d);
  box-shadow:inset -7px -8px 14px rgba(150,45,85,.14),0 10px 25px rgba(255,105,150,.15);
  animation:loaderPetalPulse 2.4s ease-in-out infinite;
}

.loader-petal:nth-child(1){transform:rotate(0deg)}
.loader-petal:nth-child(2){transform:rotate(72deg)}
.loader-petal:nth-child(3){transform:rotate(144deg)}
.loader-petal:nth-child(4){transform:rotate(216deg)}
.loader-petal:nth-child(5){transform:rotate(288deg)}

.loader-center{
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,#ffe98b,#ffd45d);
  color:white;
  font-size:26px;
  box-shadow:0 0 30px rgba(255,211,91,.7),inset 0 -5px 8px rgba(180,120,20,.12);
  z-index:5;
  animation:loaderCenterPulse 1.5s ease-in-out infinite;
}

.loader-title{
  position:relative;
  z-index:2;
  margin-top:28px;
  color:#d94f7c;
  font:italic 2rem "Libre Baskerville",serif;
}

.loader-text{
  position:relative;
  z-index:2;
  margin-top:8px;
  color:#756574;
  font:500 .72rem "DM Mono",monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
  animation:loaderTextPulse 1.5s ease-in-out infinite;
}

.loader-bar{
  position:relative;
  z-index:2;
  width:min(250px,65vw);
  height:6px;
  margin-top:24px;
  overflow:hidden;
  border-radius:20px;
  background:rgba(217,79,124,.12);
}

.loader-bar i{
  display:block;
  width:35%;
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,#ff7fa5,#ffd86b,#78d6ad,#9d83ff);
  animation:loaderProgress 1.5s ease-in-out infinite;
}

@keyframes loaderFlowerFloat{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-14px) rotate(4deg)}
}

@keyframes loaderPetalPulse{
  0%,100%{filter:saturate(1)}
  50%{filter:saturate(1.3) brightness(1.08)}
}

@keyframes loaderCenterPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.12)}
}

@keyframes loaderTextPulse{
  0%,100%{opacity:.5}
  50%{opacity:1}
}

@keyframes loaderProgress{
  0%{transform:translateX(-120%)}
  100%{transform:translateX(380%)}
}

@media(max-width:600px){
  .loader-flower{transform:scale(.85)}
  .loader-title{font-size:1.6rem}
  .loader-text{font-size:.62rem}
}

  for(let i=0;i<7;i++){

      document.createElement('button');

    heart.className = 'heart';

    heart.textContent = '♡';

    heart.onclick = () => {

      if(heart.dataset.ok)
        return;

      heart.dataset.ok = '1';

      heart.textContent = '♥';

      score++;

      $('score').textContent =
        `Hearts collected: ${score} / 7`;

      $('meter').style.width =
        `${score / 7 * 100}%`;

      heart.style.color =
        [
          '#ff719b',
          '#9d83ff',
          '#ffb45f',

        )
        rotate(360deg)
        scale(1.5)
        `;

      e.style.opacity = 0;

    });

    setTimeout(
      () => e.remove(),
      1900
    );

  }

  toast(
    'The whole forest is celebrating you. ♡'
  );

}


function heartCelebration(){

  for(let i=0;i<25;i++){

    const heart =
      document.createElement('div');

    heart.textContent = '♡';

    heart.style.cssText = `

      position:fixed;

      z-index:1800;

      left:${Math.random()*100}vw;

      bottom:-30px;

      color:#ff7fa5;

      font-size:${18+Math.random()*20}px;

      pointer-events:none;

      transition:
        transform 2.5s ease,
        opacity 2.5s ease;

    `;

    document.body.appendChild(heart);

    requestAnimationFrame(() => {

      heart.style.transform =
        `
        translateY(-${500+Math.random()*400}px)
        rotate(${Math.random()*360}deg)
        `;

      heart.style.opacity = 0;

    });

    setTimeout(
      () => heart.remove(),
      2700
    );

  }

}


/* =========================================================
   FLOWERS
========================================================= */

function blossom(
  color,
  size,
  left,
  top,
  delay
){

  return `

    <div
      class="bloom-shape"

      style="
        --c:${color};
        --s:${size}px;
        --d:${5+Math.random()*5}s;
        --delay:${delay}s;
        --r:${Math.random()*40-20}deg;

        left:${left}%;
        top:${top}%;
      ">

      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>

  `;

}


/* =========================================================
   FLOWERS + BUTTERFLIES + SPARKLES
========================================================= */

document
.querySelectorAll('.chapter')
.forEach(
  (section,index) => {

    const scene =
      document.createElement('div');

    scene.className =
      'flower-scape';


    const colors = [

      '#ff7fa5',
      '#ffd86b',
      '#9d83ff',
      '#78d6ad',
      '#82cfff',
      '#ffad72',
      '#f69ac0'

    ];


    /* MANY FLOWERS */

    for(let i=0;i<24;i++){

      const left =
        Math.random()*94;

      const top =
        Math.random()*94;

      scene.insertAdjacentHTML(

        'beforeend',

        blossom(

          colors[
            (i+index) %
            colors.length
          ],

          24 + Math.random()*55,

          left,

          top,

          -Math.random()*6

        )

      );

    }


    /* BUTTERFLIES */

    for(let i=0;i<5;i++){

      const butterfly =
        document.createElement('div');

      butterfly.className =
        'butterfly';

      butterfly.textContent =
        [
          '🦋',
          '🦋',
          '♡',
          '✿'
        ][i%4];

      butterfly.style.left =
        `${10+Math.random()*80}%`;

      butterfly.style.top =
        `${10+Math.random()*75}%`;

      butterfly.style.setProperty(
        '--duration',
        `${5+Math.random()*5}s`
      );

      butterfly.style.setProperty(
        '--delay',
        `${-Math.random()*5}s`
      );

      scene.appendChild(
        butterfly
      );

    }


    /* SPARKLES */

    for(let i=0;i<14;i++){

      const sparkle =
        document.createElement('div');

      sparkle.className =
        'sparkle';

      sparkle.textContent =
        '✦';

      sparkle.style.left =
        `${Math.random()*100}%`;

      sparkle.style.top =
        `${Math.random()*100}%`;

      sparkle.style.animationDelay =
        `${Math.random()*4}s`;

      scene.appendChild(
        sparkle
      );

    }


    /* COLORFUL ORBS */

    const orbColors = [

      '#ff8eae',
      '#a993ff',
      '#73d5a9',
      '#ffd16c',
      '#82cfff'

    ];


    for(let i=0;i<7;i++){

      const orb =
        document.createElement('div');

      orb.className =
        'orb';

      const size =
        50 + Math.random()*120;

      orb.style.width =
        `${size}px`;

      orb.style.height =
        `${size}px`;

      orb.style.left =
        `${Math.random()*100}%`;

      orb.style.top =
        `${Math.random()*100}%`;

      orb.style.background =
        orbColors[
          Math.floor(
            Math.random()*orbColors.length
          )
        ];

      orb.style.setProperty(
        '--d',
        `${5+Math.random()*6}s`
      );

      scene.appendChild(
        orb
      );

    }


    section.prepend(scene);

  }
);


/* =========================================================
   CURSOR GLOW
========================================================= */

const glow =
  document.createElement('div');

glow.className =
  'cursor-glow';

document.body.appendChild(
  glow
);

addEventListener(
  'pointermove',
  e => {

    glow.style.left =
      e.clientX + 'px';

    glow.style.top =
      e.clientY + 'px';

  }
);


/* =========================================================
   SCROLL REVEAL
========================================================= */

const observer =
  new IntersectionObserver(

    entries => {

      entries.forEach(
        entry => {

          if(entry.isIntersecting){

            entry.target
              .classList
              .add('seen');

          }

        }
      );

    },

    {
      threshold:.12
    }

  );


document
.querySelectorAll('.chapter')
.forEach(
  section =>
    observer.observe(section)
);


/* =========================================================
   CARD 3D EFFECT
========================================================= */

document
.querySelectorAll(
  '.card,.artwork,.stamp'
)
.forEach(

  element => {

    element.addEventListener(
      'pointermove',
      event => {

        const rect =
          element.getBoundingClientRect();

        const x =
          (event.clientX -
            rect.left)
          / rect.width
          -.5;

        const y =
          (event.clientY -
            rect.top)
          / rect.height
          -.5;

        element.style.transform =
          `
          perspective(900px)
          rotateY(${x*6}deg)
          rotateX(${y*-6}deg)
          translateY(-6px)
          `;

      }
    );


    element.addEventListener(
      'pointerleave',
      () => {

        element.style.transform =
          '';

      }
    );

  }

);


/* =========================================================
   CLICK PETAL EFFECT
========================================================= */

addEventListener(
  'click',
  event => {

    if(
      event.target.closest(
        'button,a,.heart,.card'
      )
    ){

      return;

    }


    for(let i=0;i<9;i++){

      const petal =
        document.createElement('i');

      petal.className =
        'click-petal';

      petal.style.left =
        event.clientX + 'px';

      petal.style.top =
        event.clientY + 'px';

      petal.style.background =
        [
          '#ff7fa5',
          '#ffd86b',
          '#9d83ff',
          '#78d6ad',
          '#82cfff',
          '#ffad72'
        ][i%6];

      document.body.appendChild(
        petal
      );


      requestAnimationFrame(() => {

        petal.style.transform =
          `
          translate(
            ${(Math.random()-.5)*260}px,
            ${(Math.random()-.5)*230}px
          )
          rotate(${Math.random()*500}deg)
          `;

        petal.style.opacity = 0;

      });


      setTimeout(
        () => petal.remove(),
        1200
      );

    }

  }
);


/* =========================================================
   SCROLL PROGRESS + NAV
========================================================= */

addEventListener(
  'scroll',
  () => {

    const max =
      document.documentElement
      .scrollHeight -
      innerHeight;

    $('progress').style.width =
      `${scrollY/max*100}%`;

    $('nav').classList.toggle(
      'scrolled',
      scrollY > 70
    );

  }
);


/* =========================================================
   START GAME
========================================================= */

startGame();


/* =========================================================
   FLOWER LOADING EFFECT — ADDED ONLY
========================================================= */
window.addEventListener('load', () => {
  const loader = document.getElementById('flowerLoader');
  if(!loader) return;

  setTimeout(() => {
    loader.classList.add('loaded');
    setTimeout(() => loader.remove(), 1000);
  }, 1800);
});

</script>

</body>
